name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify version and release commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^val appVersion = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' app/build.gradle.kts)
          test -n "$version"
          test "$TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint, and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Build signed APK and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PROPERTIES_BASE64: ${{ secrets.RELEASE_PROPERTIES_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_PROPERTIES_BASE64" ]]; then
            echo 'Both release signing secrets are required.' >&2
            exit 1
          fi
          trap 'rm -f release.jks keystore.properties' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks
          printf '%s' "$RELEASE_PROPERTIES_BASE64" | base64 --decode > keystore.properties
          chmod 600 release.jks keystore.properties
          if ! grep -qFx 'storeFile=release.jks' keystore.properties; then
            echo 'Release properties must contain storeFile=release.jks.' >&2
            exit 1
          fi
          ./gradlew --no-daemon :app:assembleRelease
          apk="CamperLog-${TAG}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=''
          for candidate in "$ANDROID_HOME"/build-tools/*/apksigner; do
            if [[ -x "$candidate" ]]; then apksigner="$candidate"; fi
          done
          if [[ -z "$apksigner" ]]; then
            echo 'Android SDK apksigner not found.' >&2
            exit 1
          fi
          "$apksigner" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
          code=$(sed -n 's/^val appVersionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          changelog=fastlane/metadata/android/en-US/changelogs/$code.txt
          changelog_de=fastlane/metadata/android/de-DE/changelogs/$code.txt
          if [[ ! -s "$changelog" || ! -s "$changelog_de" ]]; then
            echo "Changelogs for versionCode $code are missing." >&2
            exit 1
          fi
          {
            cat "$changelog"
            printf '\n**Deutsch**\n\n'
            cat "$changelog_de"
            printf '\nSigned arm64-v8a APK (Android 8.0+) with SHA-256 checksum.\n'
          } > release-notes.md
          gh release create "$TAG" --verify-tag --notes-file release-notes.md \
            "$apk" "$apk.sha256"
